name: Release

# Builds an sdist and wheel when a version tag is pushed, then attaches those
# archives and their checksums to the GitHub release. This workflow does not
# publish to PyPI.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CUDA_VISIBLE_DEVICES: ""
  PYTHONDONTWRITEBYTECODE: "1"
  UV_LOCKED: "1"

jobs:
  packages:
    name: Build and attach packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.0"
          enable-cache: true
      - name: Build sdist and wheel
        run: uv build --python 3.12
      - name: Write checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz *.whl > SHA256SUMS
      - name: Attach packages to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "$tag" --generate-notes
          fi
