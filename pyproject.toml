[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "glm-rsi-dream"
dynamic = ["version"]
description = "Experimental Spark-only learned attention memory with a self-run GLM loop"
requires-python = ">=3.11,<3.14"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
license = "MIT AND Apache-2.0 AND CC-BY-4.0"
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]
dependencies = ["tokenizers==0.22.1"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "torch==2.9.0", "build==1.3.0", "ruff==0.17.0", "mypy==2.4.0", "hypothesis==6.169.0", "pytest-cov==7.1.0", "jsonschema==4.26.0", "safetensors==0.8.0", "numpy==2.4.6"]
test = ["pytest==8.4.2", "torch==2.9.0", "hypothesis==6.169.0", "jsonschema==4.26.0", "safetensors==0.8.0", "numpy==2.4.6"]
export = ["torch==2.9.0", "safetensors==0.8.0", "numpy==2.4.6"]

[project.scripts]
glm-pocket-bundle = "glm_rsi_dream.pocket_bundle:main"
glm-dream-export = "glm_rsi_dream.export:main"
glm-rsi-dream = "glm_rsi_dream.cli:main"
glm-funnel-harness = "glm_rsi_dream.predream.harness:main"
glm-dream-trigger = "glm_rsi_dream.dream.cli:main"
glm-dreambox = "glm_rsi_dream.predream.admin_host:main"
glm-traffic-tap = "glm_rsi_dream.predream.tap_cli:main"

[tool.setuptools.dynamic]
version = {attr = "glm_rsi_dream.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
glm_rsi_dream = ["resources/*.json", "py.typed", "resources/skills/harness-funnel/*.md", "resources/admin_portal/*", "resources/admin_host/*"]
tensorfold_dream = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["gpu: requires CUDA and the compatible native runtime"]

[tool.ruff]
# Lowest version in the supported range (>=3.11,<3.14).
target-version = "py311"
respect-gitignore = false

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# CPU wheels come from the PyTorch index. explicit keeps every other package on PyPI.
[tool.uv]
required-version = ">=0.13.0"

[tool.uv.sources]
torch = [{index = "pytorch-cpu"}]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.mypy]
# Lowest version in the supported range (>=3.11,<3.14).
python_version = "3.11"
files = ["src", "tests", "tools"]
mypy_path = ["src", "inference-loader/src"]
explicit_package_bases = true
pretty = true
show_error_codes = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
untyped_calls_exclude = ["torch"]

# The strict meta-flag applies to the whole run, so these flags are listed
# per module. Tests stay on the normal checker.
[[tool.mypy.overrides]]
module = [
    "glm_rsi_dream",
    "glm_rsi_dream.*",
    "tensorfold_dream",
    "tensorfold_dream.*",
    "tools.prepare_baseline",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_return_any = true
implicit_reexport = false
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
module = ["tensorfold.*", "tokenizers", "exllamav3.*", "transformers.*", "jsonschema.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["glm_rsi_dream", "tensorfold_dream"]
omit = [
    "*/fit_attention.py",
    "*/capture_tap.py",
    "*/capture_native.py",
    "*/guard.py",
    "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 50

[tool.hypothesis]
derandomize = true
max_examples = 60
