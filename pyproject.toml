[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "glm-rsi-dream"
dynamic = ["version"]
description = "Experimental Spark-only learned attention memory with a self-run GLM loop"
requires-python = ">=3.11"
license = "MIT AND Apache-2.0 AND CC-BY-4.0"
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]
dependencies = ["tokenizers==0.22.1"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "torch==2.9.0", "build==1.3.0", "ruff==0.17.0"]
test = ["pytest==8.4.2", "torch==2.9.0"]

[project.scripts]
glm-rsi-dream = "glm_rsi_dream.cli:main"

[tool.setuptools.dynamic]
version = {attr = "glm_rsi_dream.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
glm_rsi_dream = ["resources/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["gpu: requires CUDA and the compatible native runtime"]

[tool.ruff]
target-version = "py311"
respect-gitignore = false

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
